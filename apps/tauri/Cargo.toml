[package]
name = "galleon-desktop"
rust-version = "1.96.0"
version = "2.4.0"
description = "Galleon Fleet Desktop Environment"
authors = ["Captain & Sovereign Crew"]
edition = "2021"

# tauri-2 is a standalone app, not a member of the root Rust workspace.
[workspace]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = ["tray-icon", "image-ico", "image-png"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.36", features = ["full"] }
# Proxy fleet-domain Tauri commands to the Go engine (SSOT: engine is the single source).
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

