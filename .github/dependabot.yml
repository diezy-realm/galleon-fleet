version: 2

# Feature work lands on `testing` and is released to `main`, so updates
# target `testing`. Weekly and grouped: every update PR runs the full
# Quality Gate.

updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    target-branch: testing
    open-pull-requests-limit: 1
    labels:
      - "dependencies"
    groups:
      rust-all:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: "/web"
    schedule:
      interval: weekly
    target-branch: testing
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
      - "web"
    groups:
      web-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    target-branch: testing
    open-pull-requests-limit: 1
    labels:
      - "ci"
      - "dependencies"
    groups:
      actions-all:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
    target-branch: testing
    open-pull-requests-limit: 1
    labels:
      - "ci"
      - "dependencies"
    groups:
      docker-all:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
