name: Rust cache
description: Restore/save the Rust build cache with Swatinem/rust-cache.

inputs:
  cache-on-failure:
    description: Save the cache even when the job fails.
    required: false
    default: "false"
  save-if:
    description: Only write the cache when this evaluates truthy (e.g. default branch only).
    required: false
    default: "true"
  shared-key:
    description: Shared cache key to reuse a cache across jobs. Empty = per-job cache.
    required: false
    default: ""

outputs:
  cache-hit:
    description: Whether an exact cache match was restored.
    value: ${{ steps.gh.outputs.cache-hit }}

runs:
  using: composite
  steps:
    - id: gh
      uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      with:
        cache-on-failure: ${{ inputs.cache-on-failure }}
        save-if: ${{ inputs.save-if }}
        shared-key: ${{ inputs.shared-key }}
