name: Scheduled Platform Tests

on:
  pull_request:
    branches: [main, testing]
    paths:
      - ".github/workflows/platform-tests.yml"
      - "crates/clawcrew-tools/src/coding_cli.rs"
  workflow_dispatch:
  # Weekly: a macOS minute bills at 20x a 2-vCPU Linux minute, and the
  # push-only `build-macos` check in ci.yml already catches compile breakage.
  schedule:
    - cron: "17 3 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  fmt:
    name: Format
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: 1.96.0
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

  platform-tests:
    name: Platform Test (${{ matrix.name }})
    needs: [fmt]
    # macOS only. The Windows leg was masked with continue-on-error (one known
    # red cron::scheduler test), so it billed a full workspace run without
    # ever changing the result. Windows coverage lives in windows-tests.yml
    # (`ci:windows` label); re-add a Windows row here once that test is fixed.
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: blacksmith-6vcpu-macos-15
            nextest-platform: mac
            timeout-minutes: 45
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout-minutes }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: 1.96.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: platform-test
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/testing' }}
      - name: Install protoc
        uses: arduino/setup-protoc@f4d5893b897028ff5739576ea0409746887fa536 # v3.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Ensure web/dist placeholder exists
        shell: bash
        run: mkdir -p web/dist && touch web/dist/.gitkeep
      - name: Install cargo-nextest
        shell: bash
        run: curl -LsSf "https://get.nexte.st/latest/${{ matrix.nextest-platform }}" | tar zxf - -C "$HOME/.cargo/bin"
      - name: Run tests
        shell: bash
        run: cargo nextest run --locked --workspace --exclude clawcrew-desktop --no-fail-fast
