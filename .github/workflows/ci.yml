name: Quality Gate

# GitHub Actions is disabled for this repo. CI runs locally: ~/Apps/dev-ci (bin/ci-poller polls PRs,
# gates in repos/galleon-fleet/gates.sh, results posted as `local/*` commit statuses). This file stays
# because scripts/ci/*.test.sh and tests/architecture/ci_runner_labels.rs parse it; keep the lane
# list in step with gates.sh. Windows/macOS/Nix/Docker/MSRV/32-bit/bench lanes are not run on PRs.

on:
  pull_request:
    branches: [main, master, testing]
  push:
    branches: [main, master, testing]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  fmt:
    name: Format
    runs-on: [self-hosted, linux, galleon-light]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      # Ratchet: ~450 legacy files are not rustfmt-clean, so gate only Rust files this change touches.
      - name: Check formatting of changed files
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          files=$(git diff --name-only --diff-filter=AM "$BASE" HEAD -- '*.rs' 2>/dev/null || true)
          # rustfmt on a single file also formats its child modules, so run cargo fmt and filter.
          report=$(cargo fmt --all -- --check 2>&1 | grep '^Diff in' || true)
          status=0
          for f in $files; do
            if grep -qF "/$f:" <<<"$report"; then echo "::error file=$f::not rustfmt-clean"; status=1; fi
          done
          exit $status

  repo-structure:
    name: Repository Structure
    runs-on: [self-hosted, linux, galleon-light]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Guard declared submodules
        shell: bash
        run: |
          set -euo pipefail

          gitlinks="$(mktemp)"
          declared="$(mktemp)"
          allowed="$(mktemp)"

          git ls-files -s | awk '$1 == "160000" { print $4 }' | sort > "$gitlinks"
          { git config --file .gitmodules --get-regexp '^submodule\..*\.path$' 2>/dev/null || true; } \
            | awk '{ print $2 }' | sort > "$declared"
          printf '%s\n' 'docs/book/po' > "$allowed"

          if ! cmp -s "$gitlinks" "$declared"; then
            echo "::error::Gitlink paths must exactly match .gitmodules paths."
            echo "Index gitlinks:"
            sed 's/^/  /' "$gitlinks"
            echo ".gitmodules paths:"
            sed 's/^/  /' "$declared"
            exit 1
          fi

          if ! cmp -s "$gitlinks" "$allowed"; then
            echo "::error::Unexpected submodule path. Update this guard when adding an intentional submodule."
            echo "Allowed submodule paths:"
            sed 's/^/  /' "$allowed"
            echo "Actual gitlink paths:"
            sed 's/^/  /' "$gitlinks"
            exit 1
          fi
      - name: Test translation release submodule handling
        run: scripts/release/refresh-translations.test.sh

      - name: Test release version preparation failures
        run: python3 scripts/release/bump-version.test.py

      - name: Test monthly outdated result classification
        run: bash scripts/ci/monthly_outdated_result.test.sh

      - name: Test release tool installer mappings
        run: bash scripts/ci/install_release_tool.test.sh

      - name: Test apt install timeout and retry behavior
        run: bash scripts/ci/apt_install.test.sh

      - name: Guard release attestation contract
        run: python3 scripts/ci/release_attestation_contract_test.py

      - name: Test CLI and hardware path-label ownership
        run: bash scripts/ci/path_labeler_matrix.test.sh
      - name: Test hardware feature test-lane contract
        run: bash scripts/ci/hardware_feature_test_lane.test.sh

      - name: Test release announcement composer
        run: bash scripts/ci/release_post_text.test.sh

  zerocode-rpc-boundary:
    name: Zerocode RPC Boundary
    runs-on: [self-hosted, linux, galleon-light]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Detect zerocode changes
        id: changed
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="$(git merge-base origin/${{ github.base_ref }} HEAD)"
            if git diff --name-only "$base" HEAD | grep -q -E '^apps/(zerocode|galleoncode)/'; then
              echo "run=true" >> "$GITHUB_OUTPUT"
            else
              echo "run=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Guard zerocode RPC-only boundary
        if: steps.changed.outputs.run == 'true'
        run: bash scripts/ci/zerocode_no_clawcrew_dep_gate.sh

  lint:
    name: Lint
    runs-on: [self-hosted, linux, galleon-heavy]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Ensure web/dist placeholder exists
        run: mkdir -p web/dist && touch web/dist/.gitkeep
      - name: Clippy runner contract tests
        run: bash scripts/ci/run_clippy.test.sh
      - name: Clippy
        shell: bash
        run: |
          bash scripts/ci/run_clippy.sh \
            --scope workspace \
            --summary-title "Lint diagnostics" \
            --log-name cargo-clippy.log
      - name: Rustdoc warnings gate
        # Exclude clawcrew-desktop: same surface as xtask build_api / docs-deploy.
        # Desktop pulls glib-sys on Linux; the lint runner does not install GTK libs.
        run: cargo doc --no-deps --workspace --exclude clawcrew-desktop
      - name: Comment hygiene gate (no issue refs / review notes / truncation artifacts)
        run: |
          bash scripts/ci/comment_hygiene_gate.test.sh
          bash scripts/ci/comment_hygiene_gate.sh
      - name: act-local artifact compatibility tests
        run: bash scripts/dev/act-local.test.sh

  check:
    name: Check (${{ matrix.name }})
    runs-on: [self-hosted, linux, galleon-heavy]
    timeout-minutes: 60
    env:
      RUSTFLAGS: ${{ matrix.rustflags }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: no default features
            args: --workspace --exclude clawcrew-desktop --no-default-features
            rustflags: -D warnings
          # Lint already denies warnings with --all-targets, but only at
          # --features ci-all. Feature-gated call sites are live there, so a
          # helper whose gate is wider than its callers reads as used and the
          # drift lands green. This row compiles the test targets on the
          # default surface, where that mismatch is visible.
          - name: default features, all targets
            args: --workspace --exclude clawcrew-desktop --all-targets
            rustflags: -D warnings
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Ensure web/dist placeholder exists
        run: mkdir -p web/dist && touch web/dist/.gitkeep
      - name: Check
        run: cargo check --locked ${{ matrix.args }}

  test:
    name: Test
    runs-on: [self-hosted, linux, galleon-heavy]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Check firmware protocol crate
        run: ./scripts/ci/firmware_protocol_gate.sh
      - name: Ensure web/dist placeholder exists
        run: mkdir -p web/dist && touch web/dist/.gitkeep
      - name: Run tests
        run: cargo nextest run --locked --workspace --exclude clawcrew-desktop
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER: clang
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
      # The crate's default feature set excludes the host-side hardware
      # modules. Compile-only `ci-all` coverage cannot exercise their process,
      # timeout, cleanup, and validation regressions.
      - name: Run hardware feature lib unit tests
        run: cargo nextest run --locked --no-fail-fast -p galleon-hardware --features hardware --lib
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER: clang
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: "-C link-arg=-fuse-ld=mold"

  security:
    name: Security
    runs-on: [self-hosted, linux, galleon-light]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Validate scoped lru advisory exception
        run: python3 scripts/ci/lru_advisory_scope_test.py
      - name: Check licenses, sources, and advisories
        run: cargo deny check
      - name: Lockfile integrity
        run: cargo verify-project && cargo fetch --locked

      - name: Validate YAML workflow syntax
        run: |
          pip install pyyaml -q 2>/dev/null || true
          python3 - <<'PY'
          import yaml

          for path in (
              ".github/workflows/ci.yml",
              ".github/workflows/windows-tests.yml",
              ".github/workflows/project-dashboard-plan.yml",
              ".github/workflows/pr-size-labeler.yml",
              ".github/workflows/release-stable-manual.yml",
          ):
              yaml.safe_load(open(path))
              print(f"{path}: valid")
          PY
      - name: Validate GitHub helper scripts
        run: python3 -m unittest discover -s scripts/github -p '*_test.py'
      - name: Run cargo audit (RustSec advisory database)
        run: cargo audit

  gate:
    name: CI Required Gate
    if: always()
    needs: [fmt, repo-structure, zerocode-rpc-boundary, lint, check, test, security]
    runs-on: [self-hosted, linux, galleon-light]
    steps:
      - name: Check results
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "::error::One or more CI jobs failed or were cancelled"
            exit 1
          fi
