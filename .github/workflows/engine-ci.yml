name: Engine CI

on:
  push:
    branches: [main, master, testing]
    paths:
      - 'engine/**'
      - '.github/workflows/engine-ci.yml'
  pull_request:
    branches: [main, master, testing]
    paths:
      - 'engine/**'
      - '.github/workflows/engine-ci.yml'

jobs:
  engine-test:
    name: Go Engine Test & Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: engine/go.sum

      - name: Verify Go dependencies
        working-directory: engine
        run: go mod verify

      - name: Run go vet
        working-directory: engine
        run: go vet ./...

      - name: Check Wire injection compilation
        working-directory: engine
        run: go run github.com/google/wire/cmd/wire@latest ./app

      - name: Run staticcheck
        uses: dominikh/staticcheck-action@v1.3.1
        with:
          version: "latest"
          install-go: false
          working-directory: engine

      - name: Run Go Tests with Race Detector
        working-directory: engine
        run: go test -v -race ./...
