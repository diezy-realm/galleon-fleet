# SBOM generation — CycloneDX Software Bill of Materials for supply-chain
# transparency. Covers Rust crates (cargo-cyclonedx) and npm packages
# (npm sbom). Container OS-layer SBOM handled separately by Trivy (Phase 2).
#
# Weekly on the default branch, or on demand against any ref: generate the
# SBOM (uploaded as a CI artifact on main).

name: SBOM

on:
  schedule:
    - cron: '17 6 * * 1'   # Mondays at 06:17 UTC
  workflow_dispatch:

concurrency:
  group: sbom-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sbom:
    name: CycloneDX SBOM
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # ── Rust SBOM (cargo-cyclonedx) ──────────────────────────────────
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: 1.96.0
      # cargo-cyclonedx only reads `cargo metadata`; the workspace is never
      # compiled, so a workspace build cache would be saved and never used.
      - name: Install cargo-cyclonedx
        run: cargo install cargo-cyclonedx --locked
      - name: Generate Rust SBOM
        run: |
          mkdir -p sbom
          cargo cyclonedx --all -f json
          mv *.cdx.json sbom/

      # ── npm SBOM (built-in npm sbom, Node 24) ────────────────────────
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Generate npm SBOM
        working-directory: web
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm sbom --sbom-format cyclonedx > ../sbom/web.cdx.json

      - name: Upload SBOM artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: sbom/
