name: Tier 1 Auto-Approval Notifications

# Trigger ketika Principle crew post-approve comment pada PR
# Deteksi: "✅ Approved (auto)" atau "(auto-approved)" dalam comment
on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: read
  issues: read

jobs:
  notify-tier1-approval:
    # Only run for PRs dengan auto-approval comment
    if: github.event.issue.pull_request != null && (contains(github.event.comment.body, '✅ Approved (auto)') || contains(github.event.comment.body, 'auto-approved') || contains(github.event.comment.body, 'auto-approve'))

    runs-on: [self-hosted, linux, galleon-light]
    timeout-minutes: 5

    # PR title and comment text are untrusted input: they reach the shell only
    # through environment variables, and the payload is built by jq.
    steps:
      - name: Discord notification — Tier 1 auto-approved
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          COMMENT: ${{ github.event.comment.body }}
          PR_NUMBER: ${{ github.event.issue.number }}
          PR_TITLE: ${{ github.event.issue.title }}
          PR_URL: ${{ github.event.issue.html_url }}
        continue-on-error: true
        run: |
          # Try to extract severity if mentioned in comment
          severity=normal
          if [[ "$COMMENT" =~ severity[:=\ ]*([a-z]+) ]]; then
            severity="${BASH_REMATCH[1]}"
          fi
          jq -n --arg pr "$PR_NUMBER" --arg url "$PR_URL" --arg title "$PR_TITLE" --arg severity "$severity" '{
            content: "✅ **Tier 1 — Routine Auto-Approved & Merged**",
            embeds: [{
              title: "PR #\($pr) → testing branch",
              url: $url,
              color: 3066993,
              fields: [
                {name: "Title", value: $title, inline: false},
                {name: "Status", value: "✅ Auto-approved (Principle gate pass)", inline: true},
                {name: "Severity", value: $severity, inline: true},
                {name: "Next", value: "QA testing → auto-merge to testing (if tests pass)", inline: false},
                {name: "Timeline", value: "No human review needed", inline: false}
              ],
              footer: {text: "galleon-fleet Phase 3 Automation — Tier 1 routine"}
            }]
          }' | curl -X POST -H "Content-Type: application/json" --data-binary @- "$DISCORD_WEBHOOK_URL"
