name: CodeQL

# Deep static analysis for both CodeQL-covered languages:
#   javascript-typescript — web/ dashboard source (no build step needed;
#                           CodeQL extracts interpreted languages directly)
#   rust                  — workspace crates (manual cargo build)
# Uses the shared .github/codeql/codeql-config.yml (paths-ignore tests/).
#
# Manual dispatch only. Uploading results needs GitHub code scanning, which
# this private repository does not have enabled, so scheduled or push runs
# could only fail. Dispatch it after enabling GitHub Advanced Security, or
# re-add a weekly schedule at that point.

on:
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    # Results upload to this repo's Security tab; skip on forks.
    if: github.repository == 'diezy-realm/galleon-fleet'
    # The interpreted-language scan needs no build; only Rust compiles.
    runs-on: ${{ matrix.language == 'rust' && 'blacksmith-8vcpu-ubuntu-2404' || 'blacksmith-2vcpu-ubuntu-2404' }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, rust]

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Rust toolchain
        if: matrix.language == 'rust'
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: 1.96.0

      - name: Install system dependencies
        if: matrix.language == 'rust'
        run: bash scripts/ci/apt_install.sh libudev-dev protobuf-compiler

      - name: Initialize CodeQL
        uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          languages: ${{ matrix.language }}
          config-file: .github/codeql/codeql-config.yml

      - name: Build
        if: matrix.language == 'rust'
        run: cargo build --locked --workspace --exclude clawcrew-desktop --features ci-all
        env:
          CARGO_TERM_COLOR: always

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          category: '/language:${{ matrix.language }}'
