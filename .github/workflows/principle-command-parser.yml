name: Principle Crew Command Parser

# Trigger ketika ada comment baru di PR (dari Principle crew atau reviewers)
on:
  issue_comment:
    types: [created, edited]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  parse-principle-command:
    # Only run for PRs (not issues)
    if: github.event.issue.pull_request != null && contains(github.event.comment.body, '@') && (contains(github.event.comment.user.login, 'principle') || contains(github.event.comment.body, '@squad-backend') || contains(github.event.comment.body, '@squad-frontend'))

    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 5

    # Comment text is untrusted input. It reaches shell and JavaScript only
    # through environment variables and leaves the job only as JSON built by
    # jq, never through `${{ }}` interpolation into a script.
    steps:
      - name: Parse command from comment
        id: parse-cmd
        env:
          COMMENT: ${{ github.event.comment.body }}
          PR_NUMBER: ${{ github.event.issue.number }}
        run: |
          # Extract crew name: @squad-backend, @squad-frontend, etc
          if [[ "$COMMENT" =~ @squad-backend ]]; then
            echo "crew=Backend" >> "$GITHUB_OUTPUT"
          elif [[ "$COMMENT" =~ @squad-frontend ]]; then
            echo "crew=Frontend" >> "$GITHUB_OUTPUT"
          else
            echo "crew=" >> "$GITHUB_OUTPUT"
          fi

          # Extract task command (everything after first colon or command word)
          # Pattern: @squad-backend fix: <task> OR @squad-backend <task>
          if [[ "$COMMENT" =~ fix:[[:space:]]*(.+)$ ]]; then
            TASK="${BASH_REMATCH[1]}"
          elif [[ "$COMMENT" =~ feat:[[:space:]]*(.+)$ ]]; then
            TASK="${BASH_REMATCH[1]}"
          else
            # Fallback: take everything after crew mention
            TASK=$(printf '%s' "$COMMENT" | sed 's/@squad-[a-z]*[[:space:]]*//g' | head -c 500)
          fi

          # One line only: a newline in the task must not add output keys.
          TASK="$(printf '%s' "$TASK" | tr '\r\n' '  ')"
          echo "task=$TASK" >> "$GITHUB_OUTPUT"
          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Detect critical keywords
        id: critical-check
        env:
          COMMENT: ${{ github.event.comment.body }}
          TASK: ${{ steps.parse-cmd.outputs.task }}
        run: |
          FULL_TEXT="$COMMENT $TASK"

          # Check for critical/high severity keywords
          if [[ "$FULL_TEXT" =~ (CRITICAL|HIGH|architecture|security|breaking|RCE) ]]; then
            echo "is_critical=true" >> "$GITHUB_OUTPUT"
            echo "reason=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          else
            echo "is_critical=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate command
        id: validate
        env:
          CREW: ${{ steps.parse-cmd.outputs.crew }}
          TASK: ${{ steps.parse-cmd.outputs.task }}
          IS_CRITICAL: ${{ steps.critical-check.outputs.is_critical }}
        run: |
          if [ -z "$CREW" ] && [ "$IS_CRITICAL" != "true" ]; then
            echo "status=skipped" >> "$GITHUB_OUTPUT"
            echo "reason=No crew mentioned" >> "$GITHUB_OUTPUT"
          elif [ -z "$TASK" ] || [ ${#TASK} -lt 10 ]; then
            echo "status=invalid" >> "$GITHUB_OUTPUT"
            echo "reason=Task too short or empty" >> "$GITHUB_OUTPUT"
          elif [ "$IS_CRITICAL" = "true" ]; then
            echo "status=critical" >> "$GITHUB_OUTPUT"
          else
            echo "status=valid" >> "$GITHUB_OUTPUT"
          fi

      - name: Add acknowledging comment (normal command)
        if: steps.validate.outputs.status == 'valid'
        uses: actions/github-script@v7
        env:
          CREW: ${{ steps.parse-cmd.outputs.crew }}
          TASK: ${{ steps.parse-cmd.outputs.task }}
        with:
          script: |
            const { CREW: crew, TASK: task } = process.env;
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `✅ **Principle Command Received**\n\n🔄 Spawning ${crew} crew to execute:\n\`${task}\`\n\nExpected: Fix commit within 15-30 min, PR auto-update.`
            })

      - name: Add acknowledging comment (critical escalation)
        if: steps.validate.outputs.status == 'critical'
        uses: actions/github-script@v7
        env:
          TASK: ${{ steps.parse-cmd.outputs.task }}
          REASON: ${{ steps.critical-check.outputs.reason }}
        with:
          script: |
            const { TASK: task, REASON: reason } = process.env;
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `⚠️ **Critical Issue Escalation**\n\nKeyword detected: **${reason}**\n\n🔄 Routing to Lead crew for analysis:\n\`${task}\`\n\nLead will assess severity, decide fix strategy, and coordinate with dev teams.\n\nExpected response: 2-5 min (Lead analysis)`
            })

      - name: Webhook to Kiro — spawn crew (normal command)
        if: steps.validate.outputs.status == 'valid'
        env:
          KIRO_WEBHOOK_URL: ${{ secrets.KIRO_WEBHOOK_URL }}
          KIRO_WEBHOOK_TOKEN: ${{ secrets.KIRO_WEBHOOK_TOKEN }}
          CREW: ${{ steps.parse-cmd.outputs.crew }}
          TASK: ${{ steps.parse-cmd.outputs.task }}
          PR_NUMBER: ${{ steps.parse-cmd.outputs.pr_number }}
        run: |
          jq -n --arg crew "$CREW" --arg task "$TASK" --arg pr "$PR_NUMBER" '{
            sessionKey: "hook:github:principle-command:exec",
            name: "github:principle-command:exec",
            message: "Principle crew command received:\n**Crew**: \($crew)\n**Task**: \($task)\n**PR**: \($pr)\n**Repo**: diezy-realm/galleon-fleet\n\nExecute task, commit to PR branch, push (auto-update PR)."
          }' | curl -X POST \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${KIRO_WEBHOOK_TOKEN}" \
            --data-binary @- \
            "$KIRO_WEBHOOK_URL"

      - name: Webhook to Kiro — escalate to Lead (critical)
        if: steps.validate.outputs.status == 'critical'
        env:
          KIRO_WEBHOOK_URL: ${{ secrets.KIRO_WEBHOOK_URL }}
          KIRO_WEBHOOK_TOKEN: ${{ secrets.KIRO_WEBHOOK_TOKEN }}
          TASK: ${{ steps.parse-cmd.outputs.task }}
          REASON: ${{ steps.critical-check.outputs.reason }}
          PR_NUMBER: ${{ steps.parse-cmd.outputs.pr_number }}
        run: |
          jq -n --arg task "$TASK" --arg reason "$REASON" --arg pr "$PR_NUMBER" '{
            sessionKey: "hook:github:lead-escalation:critical-issues",
            name: "github:lead-escalation:critical-issues",
            message: "Critical issue escalation from Principle crew:\n**PR**: #\($pr)\n**Keyword**: \($reason)\n**Issue**: \($task)\n**Repo**: diezy-realm/galleon-fleet\n\nAnalyze severity, decide fix strategy (remove/gate/approve-as-known-risk), coordinate with Principle + dev crews."
          }' | curl -X POST \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${KIRO_WEBHOOK_TOKEN}" \
            --data-binary @- \
            "$KIRO_WEBHOOK_URL"

      - name: Discord notification — Tier 1 (Normal command)
        if: steps.validate.outputs.status == 'valid'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          CREW: ${{ steps.parse-cmd.outputs.crew }}
          TASK: ${{ steps.parse-cmd.outputs.task }}
          PR_NUMBER: ${{ steps.parse-cmd.outputs.pr_number }}
        continue-on-error: true
        run: |
          jq -n --arg crew "$CREW" --arg task "$TASK" --arg pr "$PR_NUMBER" '{
            content: "✅ **Tier 1 — Routine Command**",
            embeds: [{
              title: "PR #\($pr) — Crew Spawned",
              color: 3066993,
              fields: [
                {name: "Crew", value: $crew, inline: true},
                {name: "Status", value: "Executing task", inline: true},
                {name: "Task", value: $task, inline: false},
                {name: "Timeline", value: "15-30 min (auto-update PR)", inline: false}
              ],
              footer: {text: "galleon-fleet Phase 3 Automation"}
            }]
          }' | curl -X POST -H "Content-Type: application/json" --data-binary @- "$DISCORD_WEBHOOK_URL"

      - name: Discord notification — Tier 2 (Critical escalation)
        if: steps.validate.outputs.status == 'critical'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TASK: ${{ steps.parse-cmd.outputs.task }}
          REASON: ${{ steps.critical-check.outputs.reason }}
          PR_NUMBER: ${{ steps.parse-cmd.outputs.pr_number }}
        continue-on-error: true
        run: |
          jq -n --arg task "$TASK" --arg reason "$REASON" --arg pr "$PR_NUMBER" '{
            content: "🔴 **Tier 2 — Critical Issue Escalated**",
            embeds: [{
              title: "PR #\($pr) — Lead Crew Analyzing",
              color: 15158332,
              fields: [
                {name: "Severity", value: "CRITICAL", inline: true},
                {name: "Trigger", value: $reason, inline: true},
                {name: "Issue", value: $task, inline: false},
                {name: "Next", value: "Lead analysis + Achmad approval", inline: false}
              ],
              footer: {text: "galleon-fleet Phase 3 Automation — awaiting decision"}
            }]
          }' | curl -X POST -H "Content-Type: application/json" --data-binary @- "$DISCORD_WEBHOOK_URL"

      - name: Log invalid command
        if: steps.validate.outputs.status == 'invalid'
        uses: actions/github-script@v7
        env:
          REASON: ${{ steps.validate.outputs.reason }}
        with:
          script: |
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `⚠️ **Invalid Principle Command**\n\nReason: ${process.env.REASON}\n\nCorrect format:\n\`\`\`\n@squad-backend fix: <detailed task description (min 10 chars)>\n@squad-frontend feat: <feature implementation task>\n\`\`\``
            })
