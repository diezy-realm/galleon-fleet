], optional = true }
pulldown-cmark = "0.13"
mail-parser = { version = "0.11.2", optional = true }
parking_lot = "0.12"
portable-atomic = "1"
prost = { version = "0.14", default-features = false, features = [
  "derive",
], optional = true }
regex = "1.10"
reqwest = { version = "0.12", default-features = false, features = [
  "__rustls-ring",
  "json",
  "multipart",
  "rustls-tls-webpki-roots-no-provider",
  "stream",
] }
rusqlite = { version = "0.37", optional = true, features = ["bundled"] }
rustls = { version = "0.23", default-features = false, features = [
  "logging",
  "ring",
  "std",
  "tls12",
], optional = true }
rustls-pki-types = { version = "1.14.0", optional = true }
serde = { version = "1.0", default-features = false, features = ["derive"] }
serde_json = { version = "1.0", default-features = false, features = ["std"] }
sha2 = "0.10"
tokio = { version = "1.50", default-features = false, features = [
  "fs",
  "io-std",
  "io-util",
  "macros",
  "net",
  "process",
  "rt-multi-thread",
  "signal",
  "sync",
  "time",
] }
tokio-rustls = { version = "0.26.4", default-features = false, features = [
  "logging",
  "ring",
  "tls12",
], optional = true }
tokio-tungstenite = { version = "0.29", default-features = false, features = [
  "connect",
  "rustls-tls-webpki-roots",
], optional = true }
tokio-util = { version = "0.7", default-features = false }
toml = "1.0"
urlencoding = "2.1"
url = "2.5"
uuid = { version = "1.22", default-features = false, features = ["std", "v4"] }
hex = "0.4"
nanohtml2text = "0.2"
rand = "0.10"
webpki-roots = { version = "1.0.6", optional = true }

cpal = { version = "0.18.1", optional = true }
shellexpand = "3.1"

# WeChat iLink (optional) — AES-128-ECB and MD5 are mandated by the iLink
# Bot media encryption protocol. The CDN requires ECB-mode ciphertext and
# MD5 file checksums in upload requests. Not our choice of primitives.
aes = { version = "0.8", optional = true }
cbc = { version = "0.1", optional = true }
ecb = { version = "0.1", optional = true }
md5 = { version = "0.8", optional = true }

[features]
default = ["default-channels"]
default-channels = [
  "channel-acp-server",
  "channel-discord",
  "channel-email",
  "channel-filesystem",
  "channel-telegram",
  "channel-webhook",
]
channels-full = [
  "channel-bluesky",
  "channel-clawdtalk",
  "channel-dingtalk",
  "channel-discord",
  "channel-git",
  "channel-imessage",
  "channel-irc",
  "channel-lark",
  "channel-line",
  "channel-linq",
  "channel-mattermost",
  "channel-mochat",
  "channel-mqtt",
  "channel-amqp",
  "channel-nextcloud",
  "channel-notion",
  "channel-qq",
  "channel-reddit",
  "channel-signal",
  "channel-slack",
  "channel-twitch",
  "channel-twitter",
  "channel-voice-call",
  "channel-wecom",
  "channel-wecom-ws",
  "channel-whatsapp-cloud",
  "default-channels",
]
# Channels with optional deps
channel-email = [
  "dep:galleon-channel-email",
]
tls-client = ["dep:tokio-rustls", "dep:webpki-roots"]
ws-transport = ["clawcrew-config/ws-transport", "dep:tokio-tungstenite"]
image-normalization = ["dep:image"]
channel-telegram = ["dep:galleon-channel-telegram", "image-normalization"]
channel-lark = ["dep:galleon-channel-lark"]
channel-git = [
  "dep:galleon-channel-git",
  "provider-github",
  "provider-gitea",
]
provider-github = ["galleon-channel-git?/provider-github"]
provider-gitea = ["galleon-channel-git?/provider-gitea"]
channel-line = ["dep:galleon-channel-line"]
channel-nostr = ["dep:galleon-channel-nostr"]
whatsapp-web = [
  "dep:galleon-channel-whatsapp",
  "galleon-channel-whatsapp/whatsapp-web",
]
# Channels with no optional deps (cfg gate only)
channel-discord = ["dep:galleon-channel-discord", "ws-transport"]
channel-slack = ["dep:galleon-channel-slack", "ws-transport"]
channel-signal = ["dep:galleon-channel-signal"]
channel-mattermost = ["dep:galleon-channel-mattermost", "ws-transport"]
channel-irc = ["dep:galleon-channel-irc"]
channel-twitch = ["dep:galleon-channel-twitch"]
channel-imessage = ["dep:galleon-channel-imessage"]
channel-dingtalk = ["dep:galleon-channel-dingtalk"]
channel-qq = ["dep:galleon-channel-qq", "ws-transport"]
channel-bluesky = ["dep:galleon-channel-bluesky"]
channel-twitter = ["dep:galleon-channel-twitter"]
channel-reddit = ["dep:galleon-channel-reddit"]
channel-notion = ["dep:galleon-channel-notion"]
channel-mqtt = ["dep:rumqttc"]
channel-filesystem = ["dep:galleon-channel-filesystem"]
channel-amqp = ["dep:galleon-channel-amqp"]
channel-linq = ["dep:galleon-channel-linq"]
channel-nextcloud = ["dep:galleon-channel-nextcloud"]
channel-mochat = ["dep:galleon-channel-mochat"]
channel-wechat = ["dep:galleon-channel-wechat"]
channel-wecom = ["dep:galleon-channel-wecom"]
channel-wecom-ws = ["dep:galleon-channel-wecom-ws"]
channel-clawdtalk = ["dep:galleon-channel-clawdtalk"]
channel-webhook = ["dep:galleon-channel-webhook", "dep:axum"]
channel-whatsapp-cloud = [
  "dep:galleon-channel-whatsapp",
  "galleon-channel-whatsapp/channel-whatsapp-cloud",
]
channel-voice-call = ["dep:galleon-channel-voice-call"]
channel-acp-server = []
channel-matrix = ["dep:galleon-channel-matrix"]
voice-wake = ["dep:cpal"]

# Tier B Regional Channels feature bundle (BR-F3, BR-F4)
channels-tier-b = [
  "channel-dingtalk",
  "channel-lark",
  "channel-line",
  "channel-mochat",
  "channel-qq",
  "channel-wechat",
  "channel-wecom",
  "channel-wecom-ws",
]

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
axum = { version = "0.8", default-features = false, features = [
  "http1",
  "json",
  "tokio",
] }
image = { version = "0.25", default-features = false, features = [
  "jpeg",
  "png",
  "webp",
] }
rusqlite = { version = "0.37", features = ["bundled"] }
tempfile = "3.26"
toml = "1.0"
wiremock = "0.6"
# `test-util` is what `#[tokio::test(start_paused = true)]` needs, so a
# duration-sensitive regression can assert the deadline the channel actually
# waits without the suite sleeping for it. Dev-only, and the same feature
# clawcrew-providers already carries for the same reason.
tokio = { version = "1.50", features = ["macros", "rt-multi-thread", "test-util"] }
