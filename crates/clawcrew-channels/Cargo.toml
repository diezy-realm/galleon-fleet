anyhow = "1.0"
lru = "0.18.2"
rumqttc = { version = "0.25", optional = true }
notify = { version = "6", optional = true }
glob = { version = "0.3", optional = true }
lapin = { version = "2", optional = true, default-features = false, features = [
  "rustls",
] }
tokio-executor-trait = { version = "2", optional = true }
tokio-reactor-trait = { version = "1", optional = true }
async-reactor-trait = { version = "1", optional = true }
p12-keystore = { version = "0.1", optional = true }
rustls-pemfile = { version = "2", optional = true }
axum = { version = "0.8", default-features = false, features = [
  "http1",
  "json",
  "macros",
  "query",
  "tokio",
  "ws",
], optional = true }
async-imap = { version = "0.11", features = [
