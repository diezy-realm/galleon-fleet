clawcrew-spawn.workspace = true
clawcrew-infra.workspace = true
clawcrew-config = { workspace = true, default-features = false }
clawcrew-log.workspace = true
clawcrew-memory.workspace = true
clawcrew-providers.workspace = true
clawcrew-tool-call-parser.workspace = true
clawcrew-tools.workspace = true
galleon-i18n.workspace = true
galleon-security-scrub.workspace = true
galleon-channel-core.workspace = true
# RF-B1: the Signal channel is split into its own feature-crate. The monolith
# re-exports it (`pub use galleon_channel_signal as signal`) so existing callers
# (`crate::signal::SignalChannel`) keep compiling. Optional, behind
