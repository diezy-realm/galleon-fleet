[package]
name = "clawcrew-channels"
rust-version.workspace = true
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Channel implementations for messaging platform integrations."
repository.workspace = true
homepage.workspace = true
publish = true

[dependencies]
clawcrew-api.workspace = true
clawcrew-spawn.workspace = true
clawcrew-infra.workspace = true
clawcrew-config = { workspace = true, default-features = false }
clawcrew-log.workspace = true
clawcrew-memory.workspace = true
clawcrew-providers.workspace = true
clawcrew-tool-call-parser.workspace = true
clawcrew-tools.workspace = true
galleon-i18n.workspace = true
galleon-security-scrub.workspace = true
# RF-B1: the Signal channel is split into its own feature-crate. The monolith
# re-exports it (`pub use galleon_channel_signal as signal`) so existing callers
# (`crate::signal::SignalChannel`) keep compiling. Optional, behind
# `channel-signal`.
galleon-channel-signal = { workspace = true, optional = true }
# RF-B1: the Bluesky channel is split into its own feature-crate. The monolith
# re-exports it (`pub use galleon_channel_bluesky as bluesky`) so existing
# callers (`crate::bluesky::BlueskyChannel`) keep compiling. Optional, behind
# `channel-bluesky`.
galleon-channel-bluesky = { workspace = true, optional = true }
# RF-C1: the iMessage channel is split into its own feature-crate. The
# RF-C1: the iMessage channel is split into its own feature-crate. The
# monolith re-exports it (`pub use galleon_channel_imessage as imessage`) so
# existing callers (`crate::imessage::IMessageChannel`) keep compiling.
# Optional, behind `channel-imessage`.
galleon-channel-imessage = { workspace = true, optional = true }
# RF-B1: the IRC channel is split into its own feature-crate. The monolith
# re-exports it (`pub use galleon_channel_irc as irc`) so existing callers
# (`crate::irc::IrcChannel`) keep compiling. Optional, behind `channel-irc`.
galleon-channel-irc = { workspace = true, optional = true }
# RF-B1: the Nostr channel is split into its own feature-crate. The monolith
# re-exports it (`pub use galleon_channel_nostr as nostr`) so existing callers
# (`crate::nostr::NostrChannel`) keep compiling. Optional, behind `channel-nostr`.
galleon-channel-nostr = { workspace = true, optional = true }
# RF-B1: the Twitch channel is split into its own feature-crate. The monolith
# re-exports it (`pub use galleon_channel_twitch as twitch`) so existing callers
# (`crate::twitch::TwitchChannel`) keep compiling. Optional, behind `channel-twitch`.
galleon-channel-twitch = { workspace = true, optional = true }
# RF-B1: the DingTalk channel is split into its own feature-crate. The monolith
# re-exports it (`pub use galleon_channel_dingtalk as dingtalk`) so existing callers
# (`crate::dingtalk::DingTalkChannel`) keep compiling. Optional, behind `channel-dingtalk`.
galleon-channel-dingtalk = { workspace = true, optional = true }
# RF-B1: the Mochat channel is split into its own feature-crate. The monolith
# re-exports it (`pub use galleon_channel_mochat as mochat`) so existing callers
# (`crate::mochat::MochatChannel`) keep compiling. Optional, behind `channel-mochat`.
galleon-channel-mochat = { workspace = true, optional = true }
# RF-B1: the ClawdTalk channel is split into its own feature-crate. The monolith
# re-exports it (`pub use galleon_channel_clawdtalk as clawdtalk`) so existing callers
# (`crate::clawdtalk::ClawdTalkChannel`) keep compiling. Optional, behind `channel-clawdtalk`.
galleon-channel-clawdtalk = { workspace = true, optional = true }
# RF-B1: the Reddit channel is split into its own feature-crate. The monolith
# re-exports it (`pub use galleon_channel_reddit as reddit`) so existing callers
# (`crate::reddit::RedditChannel`) keep compiling. Optional, behind `channel-reddit`.
galleon-channel-reddit = { workspace = true, optional = true }
# RF-B1: the Twitter channel is split into its own feature-crate. The monolith
# re-exports it (`pub use galleon_channel_twitter as twitter`) so existing callers
# (`crate::twitter::TwitterChannel`) keep compiling. Optional, behind `channel-twitter`.
galleon-channel-twitter = { workspace = true, optional = true }
# RF-B1: the Notion channel is split into its own feature-crate. The monolith
# re-exports it (`pub use galleon_channel_notion as notion`) so existing callers
# (`crate::notion::NotionChannel`) keep compiling. Optional, behind `channel-notion`.
galleon-channel-notion = { workspace = true, optional = true }
# RF-B1: the Linq channel is split into its own feature-crate. The monolith
# re-exports it (`pub use galleon_channel_linq as linq`) so existing callers
# (`crate::linq::LinqChannel`) keep compiling. Optional, behind `channel-linq`.
galleon-channel-linq = { workspace = true, optional = true }
anyhow = "1.0"
lru = "0.18.2"
rumqttc = { version = "0.25", optional = true }
notify = { version = "6", optional = true }
glob = { version = "0.3", optional = true }
lapin = { version = "2", optional = true, default-features = false, features = [
  "rustls",
] }
tokio-executor-trait = { version = "2", optional = true }
tokio-reactor-trait = { version = "1", optional = true }
async-reactor-trait = { version = "1", optional = true }
p12-keystore = { version = "0.1", optional = true }
rustls-pemfile = { version = "2", optional = true }
axum = { version = "0.8", default-features = false, features = [
  "http1",
  "json",
  "macros",
  "query",
  "tokio",
  "ws",
], optional = true }
async-imap = { version = "0.11", features = [
  "runtime-tokio",
], default-features = false, optional = true }
async-trait = "0.1"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = [
  "clock",
  "serde",
  "std",
] }
directories = "6.0"
futures-util = { version = "0.3", default-features = false, features = [
  "sink",
] }
hmac = "0.12"
image = { version = "0.25", default-features = false, features = [
  "jpeg",
  "png",
  "webp",
], optional = true }
lettre = { version = "0.11.22", default-features = false, features = [
  "builder",
  "rustls-tls",
  "smtp-transport",
], optional = true }
pulldown-cmark = "0.13"
mail-parser = { version = "0.11.2", optional = true }
matrix-sdk = { version = "0.18", optional = true, default-features = false, features = [
  "e2e-encryption",
  "markdown",
  "sqlite",
] }
mime_guess = { version = "2", optional = true }
parking_lot = "0.12"
portable-atomic = "1"
prost = { version = "0.14", default-features = false, features = [
  "derive",
], optional = true }
regex = "1.10"
reqwest = { version = "0.12", default-features = false, features = [
  "__rustls-ring",
  "json",
  "multipart",
  "rustls-tls-webpki-roots-no-provider",
  "stream",
] }
rusqlite = { version = "0.37", optional = true, features = ["bundled"] }
rustls = { version = "0.23", default-features = false, features = [
  "logging",
  "ring",
  "std",
  "tls12",
], optional = true }
rustls-pki-types = { version = "1.14.0", optional = true }
serde = { version = "1.0", default-features = false, features = ["derive"] }
serde_json = { version = "1.0", default-features = false, features = ["std"] }
sha2 = "0.10"
tokio = { version = "1.50", default-features = false, features = [
  "fs",
  "io-std",
  "io-util",
  "macros",
  "net",
  "process",
  "rt-multi-thread",
  "signal",
  "sync",
  "time",
] }
tokio-rustls = { version = "0.26.4", default-features = false, features = [
  "logging",
  "ring",
  "tls12",
], optional = true }
tokio-tungstenite = { version = "0.29", default-features = false, features = [
  "connect",
  "rustls-tls-webpki-roots",
], optional = true }
tokio-util = { version = "0.7", default-features = false }
toml = "1.0"
urlencoding = "2.1"
url = "2.5"
uuid = { version = "1.22", default-features = false, features = ["std", "v4"] }
hex = "0.4"
nanohtml2text = "0.2"
rand = "0.10"
webpki-roots = { version = "1.0.6", optional = true }

# WhatsApp Web (optional). Registry releases from oxidezap/whatsapp-rust.
# Moving from the old fork pin to 0.7.0 includes the upstream protobuf-codegen
# migration, so the storage and event adapters are ported in the same change.
# Registry dependencies also make clawcrew-channels publishable to crates.io.
whatsapp-rust = { version = "0.7.0", optional = true, default-features = false, features = [
  "tokio-runtime",
] }
wacore = { version = "0.7.0", optional = true, default-features = false }
wacore-binary = { version = "0.7.0", optional = true, default-features = false }
waproto = { version = "0.7.0", optional = true, default-features = false }

cpal = { version = "0.18.1", optional = true }
whatsapp-rust-ureq-http-client = { version = "0.7.0", optional = true }
whatsapp-rust-tokio-transport = { version = "0.7.0", optional = true, default-features = false }
qrcode = { version = "0.14", optional = true }
# `bytes` is required for the `Bytes` return types in wacore storage
# traits (SignalStore::get_session / load_prekey). Feature-gated to
# whatsapp-web alongside the rest of the WA Web stack.
bytes = { version = "1", optional = true }
shellexpand = "3.1"

# WeChat iLink (optional) — AES-128-ECB and MD5 are mandated by the iLink
# Bot media encryption protocol. The CDN requires ECB-mode ciphertext and
# MD5 file checksums in upload requests. Not our choice of primitives.
aes = { version = "0.8", optional = true }
cbc = { version = "0.1", optional = true }
ecb = { version = "0.1", optional = true }
md5 = { version = "0.8", optional = true }

# GitHub App channel - RS256 JWT signing for app authentication. The
# `aws_lc_rs` backend is required to avoid jsonwebtoken's `rust_crypto`
# path, which pulls the unmaintained `rsa` crate (RUSTSEC-2023-0071,
# Marvin Attack, no fixed release) and fails `cargo audit`. aws-lc-rs is
# already in the workspace lockfile, so this adds no new heavy dependency.
jsonwebtoken = { version = "10", optional = true, default-features = false, features = [
  "aws_lc_rs",
  "use_pem",
] }
thiserror = { version = "2.0", optional = true }

[features]
default = ["default-channels"]
default-channels = [
  "channel-acp-server",
  "channel-discord",
  "channel-email",
  "channel-filesystem",
  "channel-telegram",
  "channel-webhook",
]
channels-full = [
  "channel-bluesky",
  "channel-clawdtalk",
  "channel-dingtalk",
  "channel-discord",
  "channel-git",
  "channel-imessage",
  "channel-irc",
  "channel-lark",
  "channel-line",
  "channel-linq",
  "channel-mattermost",
  "channel-mochat",
  "channel-mqtt",
  "channel-amqp",
  "channel-nextcloud",
  "channel-notion",
  "channel-qq",
  "channel-reddit",
  "channel-signal",
  "channel-slack",
  "channel-twitch",
  "channel-twitter",
  "channel-voice-call",
  "channel-wecom",
  "channel-wecom-ws",
  "channel-whatsapp-cloud",
  "default-channels",
]
# Channels with optional deps
channel-email = [
  "dep:async-imap",
  "dep:lettre",
  "dep:mail-parser",
  "dep:rustls",
  "dep:rustls-pki-types",
  "tls-client",
]
tls-client = ["dep:tokio-rustls", "dep:webpki-roots"]
ws-transport = ["clawcrew-config/ws-transport", "dep:tokio-tungstenite"]
image-normalization = ["dep:image"]
channel-telegram = ["image-normalization"]
channel-lark = ["dep:aes", "dep:axum", "dep:cbc", "dep:prost", "ws-transport"]
channel-git = ["provider-github", "provider-gitea"]
# Forge providers for the git channel. `provider-github` (GitHub Apps) and
# `provider-gitea` (Gitea/Forgejo PAT) are default-on under `channel-git`;
# future forges (e.g. `provider-gitlab`) add their own sub-feature and deps here.
provider-github = ["dep:jsonwebtoken", "dep:thiserror"]
provider-gitea = []
channel-line = ["dep:axum"]
channel-nostr = ["dep:galleon-channel-nostr"]
whatsapp-web = [
  "dep:bytes",
  "dep:qrcode",
  "dep:rusqlite",
  "dep:wacore",
  "dep:wacore-binary",
  "dep:waproto",
  "dep:whatsapp-rust",
  "dep:whatsapp-rust-tokio-transport",
  "dep:whatsapp-rust-ureq-http-client",
  "image-normalization",
]
# Channels with no optional deps (cfg gate only)
channel-discord = ["ws-transport"]
channel-slack = ["ws-transport"]
channel-signal = ["dep:galleon-channel-signal"]
channel-mattermost = ["ws-transport"]
channel-irc = ["dep:galleon-channel-irc"]
channel-twitch = ["dep:galleon-channel-twitch"]
channel-imessage = ["dep:galleon-channel-imessage"]
channel-dingtalk = ["dep:galleon-channel-dingtalk"]
channel-qq = ["ws-transport"]
channel-bluesky = ["dep:galleon-channel-bluesky"]
channel-twitter = ["dep:galleon-channel-twitter"]
channel-reddit = ["dep:galleon-channel-reddit"]
channel-notion = ["dep:galleon-channel-notion"]
channel-mqtt = ["dep:rumqttc"]
channel-filesystem = ["dep:notify", "dep:glob"]
channel-amqp = ["dep:lapin", "dep:tokio-executor-trait", "dep:tokio-reactor-trait", "dep:async-reactor-trait", "dep:p12-keystore", "dep:rustls-pemfile"]
channel-linq = ["dep:galleon-channel-linq"]
channel-nextcloud = []
channel-mochat = ["dep:galleon-channel-mochat"]
channel-wechat = [
  "dep:aes",
  "dep:ecb",
  "dep:md5",
  "dep:mime_guess",
  "dep:qrcode",
]
channel-wecom = []
channel-wecom-ws = ["dep:aes", "dep:cbc", "ws-transport"]
channel-clawdtalk = ["dep:galleon-channel-clawdtalk"]
channel-webhook = ["dep:axum"]
channel-whatsapp-cloud = []
channel-voice-call = ["dep:axum"]
channel-acp-server = []
channel-matrix = ["dep:matrix-sdk", "dep:mime_guess"]
voice-wake = ["dep:cpal"]

# Tier B Regional Channels feature bundle (BR-F3, BR-F4)
channels-tier-b = [
  "channel-dingtalk",
  "channel-lark",
  "channel-line",
  "channel-mochat",
  "channel-qq",
  "channel-wechat",
  "channel-wecom",
  "channel-wecom-ws",
]

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
axum = { version = "0.8", default-features = false, features = [
  "http1",
  "json",
  "tokio",
] }
image = { version = "0.25", default-features = false, features = [
  "jpeg",
  "png",
  "webp",
] }
matrix-sdk = { version = "0.18", default-features = false, features = [
  "testing",
  "e2e-encryption",
  "markdown",
  "sqlite",
] }
matrix-sdk-base = { version = "0.18", default-features = false, features = ["e2e-encryption"] }
matrix-sdk-test = "0.18"
rusqlite = { version = "0.37", features = ["bundled"] }
tempfile = "3.26"
toml = "1.0"
wiremock = "0.6"
# `test-util` is what `#[tokio::test(start_paused = true)]` needs, so a
# duration-sensitive regression can assert the deadline the channel actually
# waits without the suite sleeping for it. Dev-only, and the same feature
# clawcrew-providers already carries for the same reason.
tokio = { version = "1.50", features = ["macros", "rt-multi-thread", "test-util"] }
