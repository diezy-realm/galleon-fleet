[package]
name = "galleon-channel-amqp"
rust-version.workspace = true
version.workspace = true
edition.workspace = true
license.workspace = true
description = "AMQP channel feature-crate (RF-B1 split; RabbitMQ/AMQP messaging ported from galleon-channels)."
repository.workspace = true
homepage.workspace = true
publish = true

[lints]
workspace = true

[dependencies]
galleon-channel-core.workspace = true
galleon-api.workspace = true
galleon-config = { workspace = true, default-features = false }
galleon-infra.workspace = true
galleon-log.workspace = true
async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
anyhow = "1.0"
futures-util = "0.3"
lapin = { version = "2", default-features = false, features = ["rustls"] }
tokio-executor-trait = "2"
tokio-reactor-trait = "1"
async-reactor-trait = "1"
p12-keystore = "0.1"
portable-atomic = "1"
rustls-pemfile = "2"
serde = { version = "1.0", default-features = false, features = ["derive"] }
serde_json = { version = "1.0", default-features = false, features = ["std"] }
tokio = { version = "1.50", default-features = false, features = ["sync", "time"] }

[dev-dependencies]
tempfile = "3.26"
tokio = { version = "1.50", default-features = false, features = [
  "macros",
  "rt-multi-thread",
] }

[features]
default = []
