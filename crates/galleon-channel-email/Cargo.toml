[package]
name = "galleon-channel-email"
rust-version.workspace = true
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Email (IMAP/SMTP) channel feature-crate (RF-B1 split; ported from galleon-channels)."
repository.workspace = true
homepage.workspace = true
publish = true

[dependencies]
galleon-channel-core.workspace = true
galleon-api.workspace = true
galleon-config = { workspace = true, default-features = false }
galleon-log.workspace = true
galleon-providers.workspace = true
galleon-tools.workspace = true
anyhow = "1.0"
async-imap = { version = "0.11", features = [
  "runtime-tokio",
], default-features = false }
async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
hex = "0.4"
lettre = { version = "0.11.22", default-features = false, features = [
  "builder",
  "rustls-tls",
  "smtp-transport",
] }
mail-parser = "0.11.2"
pulldown-cmark = "0.13"
rustls = "0.23"
rustls-pki-types = "1.13"
serde_json = { version = "1.0", default-features = false, features = ["std"] }
sha2 = "0.10"
tokio = { version = "1.50", default-features = false, features = ["net", "rt", "sync", "time"] }
tokio-rustls = { version = "0.26", default-features = false }
webpki-roots = "1.0.6"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1.50", default-features = false, features = [
  "macros",
  "rt-multi-thread",
] }

[features]
default = []
