[package]
name = "galleon-channel-wecom-ws"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "WeCom WebSocket channel for the Galleon fleet."
repository.workspace = true
homepage.workspace = true
publish = true

[lints]
workspace = true

[dependencies]
galleon-api.workspace = true
galleon-config = { workspace = true, features = ["ws-transport"] }
galleon-spawn.workspace = true
galleon-log.workspace = true
galleon-tool-call-parser.workspace = true
galleon-i18n.workspace = true
galleon-security-scrub.workspace = true
galleon-channel-core.workspace = true

aes = "0.8"
cbc = "0.1"
base64 = "0.22"
parking_lot = "0.12"
async-trait = "0.1"
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.9"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls"] }
tracing = "0.1"

[dev-dependencies]
toml = "1.0"
