[package]
name = "galleon-security-scrub"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Credential scrubbing and leak detection extracted from clawcrew-runtime (PR-32 / R-11)."
repository.workspace = true
homepage.workspace = true
publish = true

[dependencies]
clawcrew-config.workspace = true
regex = "1.10"
serde_json = { version = "1.0", default-features = false, features = ["std"] }

[features]
schema-export = ["clawcrew-config/schema-export"]
