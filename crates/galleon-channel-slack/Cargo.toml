[package]
name = "galleon-channel-slack"
rust-version.workspace = true
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Slack channel feature-crate (RF-B1 split; Socket Mode WebSocket, Web API polling, and Block Kit integration ported from galleon-channels)."
repository.workspace = true
homepage.workspace = true
publish = true

[dependencies]
galleon-channel-core.workspace = true
clawcrew-api.workspace = true
galleon-config = { workspace = true, default-features = false, features = ["ws-transport"] }
galleon-log.workspace = true
galleon-providers.workspace = true
galleon-spawn.workspace = true
galleon-i18n.workspace = true
anyhow = "1.0"
async-trait = "0.1"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
hex = "0.4"
rand = "0.10"
reqwest = { version = "0.12", default-features = false, features = [
  "__rustls-ring",
  "json",
  "multipart",
  "rustls-tls-webpki-roots-no-provider",
  "stream",
] }
serde = { version = "1.0", default-features = false, features = ["derive"] }
serde_json = { version = "1.0", default-features = false, features = ["std"] }
sha2 = "0.10"
tokio = { version = "1.50", default-features = false, features = [
  "sync",
  "fs",
  "io-util",
  "time",
  "net",
  "macros",
] }
tokio-tungstenite = { version = "0.29", default-features = false, features = [
  "connect",
  "rustls-tls-webpki-roots",
] }
uuid = { version = "1.22", default-features = false, features = ["std", "v4"] }

[dev-dependencies]
tempfile = "3.26"
wiremock = "0.6"
tokio = { version = "1.50", default-features = false, features = [
  "macros",
  "rt-multi-thread",
  "sync",
  "time",
  "test-util",
] }

[features]
default = []
