[package]
name = "galleon-channel-voice-call"
rust-version.workspace = true
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Real-time voice call channel for Twilio, Telnyx, and Plivo."
repository.workspace = true
homepage.workspace = true
publish = true

[dependencies]
galleon-channel-core.workspace = true
clawcrew-api.workspace = true
clawcrew-config.workspace = true
clawcrew-log.workspace = true
chrono = { version = "0.4", default-features = false, features = ["clock"] }
reqwest = { version = "0.12", default-features = false, features = [
  "__rustls-ring",
  "json",
  "rustls-tls-webpki-roots-no-provider",
] }
anyhow = "1.0"
async-trait = "0.1"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
serde = { version = "1.0", default-features = false, features = ["derive"] }
serde_json = { version = "1.0", default-features = false, features = ["std"] }
tokio = { version = "1.50", default-features = false, features = [
  "sync",
  "net",
  "macros",
] }

[dev-dependencies]
tempfile = "3.26"
