[package]
name = "galleon-channel-webhook"
rust-version.workspace = true
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Generic Webhook channel feature-crate (RF-B1 split; ported from galleon-channels)."
repository.workspace = true
homepage.workspace = true
publish = true

[dependencies]
galleon-channel-core.workspace = true
clawcrew-api.workspace = true
galleon-config = { workspace = true, default-features = false }
galleon-log.workspace = true
async-trait = "0.1"
anyhow = "1.0"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
hex = "0.4"
hmac = "0.12"
portable-atomic = "1.10"
rand = "0.10"
reqwest = { version = "0.12", default-features = false, features = [
  "__rustls-ring",
  "json",
  "rustls-tls-webpki-roots-no-provider",
] }
serde = { version = "1.0", default-features = false, features = ["derive"] }
serde_json = { version = "1.0", default-features = false, features = ["std"] }
sha2 = "0.10"
tokio = { version = "1.50", default-features = false, features = ["sync", "time", "net", "rt"] }

[dev-dependencies]
galleon-spawn.workspace = true
wiremock = "0.6"
tokio = { version = "1.50", default-features = false, features = [
  "macros",
  "rt-multi-thread",
] }

[features]
default = []
