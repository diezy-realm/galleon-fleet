[package]
name = "galleon-channel-mattermost"
rust-version.workspace = true
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Mattermost channel feature-crate (RF-B1 split; WebSocket and REST polling integration ported from galleon-channels)."
repository.workspace = true
homepage.workspace = true
publish = true

[lints]
workspace = true

[dependencies]
galleon-channel-core.workspace = true
galleon-api.workspace = true
galleon-config = { workspace = true, default-features = false, features = ["ws-transport"] }
galleon-log.workspace = true
galleon-spawn.workspace = true
galleon-i18n.workspace = true
anyhow = "1.0"
async-trait = "0.1"
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
parking_lot = "0.12"
rand = "0.10"
reqwest = { version = "0.12", default-features = false, features = [
  "__rustls-ring",
  "json",
  "rustls-tls-webpki-roots-no-provider",
  "stream",
] }
serde = { version = "1.0", default-features = false, features = ["derive"] }
serde_json = { version = "1.0", default-features = false, features = ["std"] }
tokio = { version = "1.50", default-features = false, features = ["sync", "fs", "io-util", "time", "net", "macros"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = [
  "connect",
  "rustls-tls-webpki-roots",
] }
url = "2.5"

[dev-dependencies]
wiremock = "0.6"
tokio = { version = "1.50", default-features = false, features = [
  "macros",
  "rt-multi-thread",
  "sync",
  "net",
  "io-util",
  "time",
] }

[features]
default = []
