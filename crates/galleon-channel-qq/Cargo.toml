[package]
name = "galleon-channel-qq"
rust-version.workspace = true
version.workspace = true
edition.workspace = true
license.workspace = true
description = "QQ Official Bot channel feature-crate (RF-B1 split; WebSocket gateway & OpenAPI reply ported from galleon-channels)."
repository.workspace = true
homepage.workspace = true
publish = true

[dependencies]
galleon-channel-core.workspace = true
clawcrew-api.workspace = true
galleon-config = { workspace = true, default-features = false, features = ["ws-transport"] }
clawcrew-log.workspace = true
galleon-spawn.workspace = true
async-trait = "0.1"
anyhow = "1.0"
base64 = "0.22"
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
reqwest = { version = "0.12", default-features = false, features = [
  "__rustls-ring",
  "json",
  "rustls-tls-webpki-roots-no-provider",
  "stream",
] }
serde = { version = "1.0", default-features = false, features = ["derive"] }
serde_json = { version = "1.0", default-features = false, features = ["std"] }
sha2 = "0.10"
tokio = { version = "1.50", default-features = false, features = ["sync", "fs", "io-util", "time", "net"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = [
  "connect",
  "rustls-tls-webpki-roots",
] }
uuid = { version = "1.22", default-features = false, features = ["std", "v4"] }
rand = "0.10"

[dev-dependencies]
wiremock = "0.6"
tempfile = "3.26"
tokio = { version = "1.50", default-features = false, features = [
  "macros",
  "rt-multi-thread",
  "sync",
  "net",
  "io-util",
  "time",
] }

[features]
default = []
