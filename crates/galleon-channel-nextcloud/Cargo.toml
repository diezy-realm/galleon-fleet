[package]
name = "galleon-channel-nextcloud"
rust-version.workspace = true
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Nextcloud Talk channel feature-crate (RF-B1 split; webhook bot API messaging and signing ported from galleon-channels)."
repository.workspace = true
homepage.workspace = true
publish = true

[dependencies]
galleon-channel-core.workspace = true
clawcrew-api.workspace = true
clawcrew-config = { workspace = true, default-features = false }
clawcrew-log.workspace = true
async-trait = "0.1"
anyhow = "1.0"
hex = "0.4"
hmac = "0.12"
parking_lot = "0.12"
sha2 = "0.10"
reqwest = { version = "0.12", default-features = false, features = [
  "__rustls-ring",
  "json",
  "rustls-tls-webpki-roots-no-provider",
] }
serde = { version = "1.0", default-features = false, features = ["derive"] }
serde_json = { version = "1.0", default-features = false, features = ["std"] }
tokio = { version = "1.50", default-features = false, features = ["sync", "time"] }
uuid = { version = "1.22", default-features = false, features = ["std", "v4"] }

[dev-dependencies]
wiremock = "0.6"
tokio = { version = "1.50", default-features = false, features = [
  "macros",
  "rt-multi-thread",
] }

[features]
default = []
