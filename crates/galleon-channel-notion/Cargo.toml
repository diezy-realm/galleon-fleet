[package]
name = "galleon-channel-notion"
rust-version.workspace = true
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Notion channel feature-crate (RF-B1 split; database task board polling and syncing ported from galleon-channels)."
repository.workspace = true
homepage.workspace = true
publish = true

[dependencies]
galleon-api.workspace = true
galleon-config = { workspace = true, default-features = false }
galleon-log.workspace = true
async-trait = "0.1"
anyhow = "1.0"
reqwest = { version = "0.12", default-features = false, features = [
  "__rustls-ring",
  "json",
  "rustls-tls-webpki-roots-no-provider",
] }
serde = { version = "1.0", default-features = false, features = ["derive"] }
serde_json = { version = "1.0", default-features = false, features = ["std"] }
tokio = { version = "1.50", default-features = false, features = ["sync", "time"] }

[dev-dependencies]
tokio = { version = "1.50", default-features = false, features = [
  "macros",
  "rt-multi-thread",
] }

[features]
default = []
