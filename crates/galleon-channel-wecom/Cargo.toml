[package]
name = "galleon-channel-wecom"
rust-version.workspace = true
version.workspace = true
edition.workspace = true
license.workspace = true
description = "WeCom (WeChat Enterprise) Bot Webhook channel feature-crate (RF-B1 split; ported from galleon-channels)."
repository.workspace = true
homepage.workspace = true
publish = true

[dependencies]
galleon-channel-core.workspace = true
clawcrew-api.workspace = true
clawcrew-config = { workspace = true, default-features = false }
clawcrew-log.workspace = true
async-trait = "0.1"
anyhow = "1.0"
reqwest = { version = "0.12", default-features = false, features = [
  "__rustls-ring",
  "json",
  "rustls-tls-webpki-roots-no-provider",
] }
serde_json = { version = "1.0", default-features = false, features = ["std"] }
tokio = { version = "1.50", default-features = false, features = ["sync"] }

[features]
default = []
