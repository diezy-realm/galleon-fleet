[package]
name = "galleon-channel-whatsapp"
rust-version.workspace = true
version.workspace = true
edition.workspace = true
license.workspace = true
description = "WhatsApp channel feature-crate (Cloud API and WhatsApp Web QR integration ported from clawcrew-channels)."
repository.workspace = true
homepage.workspace = true
publish = true

[features]
default = ["channel-whatsapp-cloud", "whatsapp-web"]
channel-whatsapp-cloud = []
whatsapp-web = [
  "dep:bytes",
  "dep:qrcode",
  "dep:rusqlite",
  "dep:wacore",
  "dep:wacore-binary",
  "dep:waproto",
  "dep:whatsapp-rust",
  "dep:whatsapp-rust-tokio-transport",
  "dep:whatsapp-rust-ureq-http-client",
]

[dependencies]
galleon-channel-core.workspace = true
clawcrew-api.workspace = true
clawcrew-config.workspace = true
clawcrew-log.workspace = true
galleon-spawn.workspace = true
galleon-i18n.workspace = true
anyhow = "1.0"
async-trait = "0.1"
bytes = { version = "1", optional = true }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
parking_lot = "0.12"
qrcode = { version = "0.14", optional = true }
regex = "1.12"
reqwest = { version = "0.12", default-features = false, features = [
  "__rustls-ring",
  "json",
  "multipart",
  "rustls-tls-webpki-roots-no-provider",
  "stream",
] }
rusqlite = { version = "0.37", optional = true, features = ["bundled"] }
serde = { version = "1.0", default-features = false, features = ["derive"] }
serde_json = { version = "1.0", default-features = false, features = ["std"] }
shellexpand = "3.1"
tokio = { version = "1.50", default-features = false, features = [
  "sync",
  "time",
  "macros",
  "signal",
] }
uuid = { version = "1.22", default-features = false, features = ["std", "v4"] }
wacore = { version = "0.7.0", optional = true, default-features = false }
wacore-binary = { version = "0.7.0", optional = true, default-features = false }
waproto = { version = "0.7.0", optional = true, default-features = false }
whatsapp-rust = { version = "0.7.0", optional = true, default-features = false, features = [
  "tokio-runtime",
] }
whatsapp-rust-tokio-transport = { version = "0.7.0", optional = true, default-features = false }
whatsapp-rust-ureq-http-client = { version = "0.7.0", optional = true }

[dev-dependencies]
tempfile = "3.26"
toml = "0.8"
wiremock = "0.6"
tokio = { version = "1.50", features = ["macros", "rt-multi-thread", "test-util"] }
