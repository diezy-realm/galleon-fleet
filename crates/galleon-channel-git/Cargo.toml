[package]
name = "galleon-channel-git"
rust-version.workspace = true
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Git channel feature-crate (GitHub and Gitea polling and webhook integration ported from galleon-channels)."
repository.workspace = true
homepage.workspace = true
publish = true

[features]
default = ["provider-github", "provider-gitea"]
provider-github = ["dep:jsonwebtoken"]
provider-gitea = []

[dependencies]
galleon-channel-core.workspace = true
galleon-api.workspace = true
galleon-config.workspace = true
galleon-log.workspace = true
galleon-providers.workspace = true
parking_lot = "0.12"
rand = "0.8"
anyhow = "1.0"
async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
jsonwebtoken = { version = "10", default-features = false, features = [
  "aws_lc_rs",
  "use_pem",
], optional = true }
reqwest = { version = "0.12", default-features = false, features = [
  "__rustls-ring",
  "json",
  "rustls-tls-webpki-roots-no-provider",
] }
serde = { version = "1.0", default-features = false, features = ["derive"] }
serde_json = { version = "1.0", default-features = false, features = ["std"] }
thiserror = "2.0"
tokio = { version = "1.50", default-features = false, features = [
  "sync",
  "time",
  "macros",
] }

[dev-dependencies]
base64 = "0.22"
wiremock = "0.6"
tokio = { version = "1.50", features = ["macros", "rt-multi-thread", "test-util"] }
