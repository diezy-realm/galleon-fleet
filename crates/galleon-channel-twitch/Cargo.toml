[package]
name = "galleon-channel-twitch"
rust-version.workspace = true
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Twitch chat channel feature-crate (RF-B1 split; adapter over galleon-channel-irc ported from galleon-channels)."
repository.workspace = true
homepage.workspace = true
publish = true

[lints]
workspace = true

[dependencies]
galleon-channel-irc.workspace = true
galleon-api.workspace = true
galleon-spawn.workspace = true
async-trait = "0.1"
anyhow = "1.0"
tokio = { version = "1.50", default-features = false, features = ["sync"] }

[dev-dependencies]
tokio = { version = "1.50", default-features = false, features = [
  "macros",
  "rt",
  "sync",
] }

[features]
default = []
