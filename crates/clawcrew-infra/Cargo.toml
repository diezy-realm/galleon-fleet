[package]
name = "clawcrew-infra"
rust-version.workspace = true
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Channel infrastructure: session backends, debouncing, stall watchdog."
repository.workspace = true
homepage.workspace = true
publish = true

[dependencies]
clawcrew-log.workspace = true
clawcrew-api.workspace = true
clawcrew-spawn.workspace = true
anyhow = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
parking_lot = "0.12"
portable-atomic = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1.0", default-features = false, features = ["derive"] }
serde_json = { version = "1.0", default-features = false, features = ["std"] }
tempfile = "3.26"
sha2 = "0.10"
hex = "0.4"
libc = "0.2"
schemars = { version = "1.2", optional = true }
sysinfo = { version = "0.36", default-features = false, features = ["system"] }
tokio = { version = "1.50", default-features = false, features = ["sync", "time"] }
url = "2.5"

[features]
default = []
schema-export = ["dep:schemars"]

[dev-dependencies]
tokio = { version = "1.50", features = ["rt-multi-thread", "macros"] }
