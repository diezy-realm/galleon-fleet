[package]
name = "galleon-channel-irc"
rust-version.workspace = true
version.workspace = true
edition.workspace = true
license.workspace = true
description = "IRC channel feature-crate (RF-B1 split; persistent TLS connection and message loop ported from galleon-channels)."
repository.workspace = true
homepage.workspace = true
publish = true

[dependencies]
galleon-channel-core.workspace = true
clawcrew-api.workspace = true
async-trait = "0.1"
portable-atomic = "1"
tokio = { version = "1.50", default-features = false, features = [
  "io-util",
  "net",
  "sync",
  "time",
] }
clawcrew-log.workspace = true
anyhow = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
webpki-roots = "1.0.6"
serde_json = { version = "1.0", default-features = false, features = ["std"] }
tokio-rustls = { version = "0.26.4", default-features = false, features = [
  "logging",
  "ring",
  "tls12",
] }

[dev-dependencies]
clawcrew-config = { workspace = true, default-features = false }
toml = "1.0"
tokio = { version = "1.50", default-features = false, features = [
  "macros",
  "rt",
  "io-util",
  "net",
  "sync",
  "time",
] }

[features]
default = []
