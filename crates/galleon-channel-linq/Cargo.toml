[package]
name = "galleon-channel-linq"
rust-version.workspace = true
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Linq channel feature-crate (RF-B1 split; partner API messaging and webhook verification ported from galleon-channels)."
repository.workspace = true
homepage.workspace = true
publish = true

[lints]
workspace = true

[dependencies]
galleon-channel-core.workspace = true
galleon-api.workspace = true
galleon-config = { workspace = true, default-features = false }
galleon-log.workspace = true
async-trait = "0.1"
anyhow = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
hex = "0.4"
hmac = "0.12"
sha2 = "0.10"
reqwest = { version = "0.12", default-features = false, features = [
  "__rustls-ring",
  "json",
  "rustls-tls-webpki-roots-no-provider",
] }
serde = { version = "1.0", default-features = false, features = ["derive"] }
serde_json = { version = "1.0", default-features = false, features = ["std"] }
tokio = { version = "1.50", default-features = false, features = ["sync", "time"] }
uuid = { version = "1.22", default-features = false, features = ["std", "v4"] }

[dev-dependencies]
tokio = { version = "1.50", default-features = false, features = [
  "macros",
  "rt-multi-thread",
] }

[features]
default = []
