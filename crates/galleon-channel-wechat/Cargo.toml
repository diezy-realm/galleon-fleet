[package]
name = "galleon-channel-wechat"
rust-version.workspace = true
version.workspace = true
edition.workspace = true
license.workspace = true
description = "WeChat personal iLink Bot channel feature-crate (RF-B1 split; AES-128-ECB and MD5 CDN media integration ported from galleon-channels)."
repository.workspace = true
homepage.workspace = true
publish = true

[dependencies]
galleon-channel-core.workspace = true
clawcrew-api.workspace = true
galleon-config.workspace = true
galleon-log.workspace = true
galleon-spawn.workspace = true
galleon-i18n.workspace = true
aes = "0.8"
ecb = "0.1"
md5 = "0.8"
anyhow = "1.0"
async-trait = "0.1"
base64 = "0.22"
mime_guess = "2.0"
parking_lot = "0.12"
qrcode = { version = "0.14", default-features = false }
reqwest = { version = "0.12", default-features = false, features = [
  "__rustls-ring",
  "json",
  "multipart",
  "rustls-tls-webpki-roots-no-provider",
  "stream",
] }
serde = { version = "1.0", default-features = false, features = ["derive"] }
serde_json = { version = "1.0", default-features = false, features = ["std"] }
sha2 = "0.10"
hex = "0.4"
rand = "0.10"
regex = "1.10"
shellexpand = "3.1"
urlencoding = "2.1"
directories = "6.0"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
tokio = { version = "1.50", default-features = false, features = ["sync", "fs", "io-util", "time", "net", "macros"] }
uuid = { version = "1.22", default-features = false, features = ["std", "v4"] }

[dev-dependencies]
tempfile = "3.26"
wiremock = "0.6"
tokio = { version = "1.50", default-features = false, features = [
  "macros",
  "rt-multi-thread",
  "sync",
  "net",
  "io-util",
  "time",
] }

[features]
default = []
