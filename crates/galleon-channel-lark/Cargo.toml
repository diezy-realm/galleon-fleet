[package]
name = "galleon-channel-lark"
rust-version.workspace = true
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Lark / Feishu channel feature-crate (RF-B1 split; WebSocket gateway & Webhook events integration ported from clawcrew-channels)."
repository.workspace = true
homepage.workspace = true
publish = true

[dependencies]
galleon-channel-core.workspace = true
clawcrew-api.workspace = true
clawcrew-config = { workspace = true, default-features = false, features = ["ws-transport"] }
clawcrew-log.workspace = true
galleon-spawn.workspace = true
galleon-i18n.workspace = true
aes = "0.8"
anyhow = "1.0"
async-trait = "0.1"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "macros", "tokio"] }
base64 = "0.22"
cbc = "0.1"
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
hex = "0.4"
prost = { version = "0.14", default-features = false, features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = [
  "__rustls-ring",
  "json",
  "multipart",
  "rustls-tls-webpki-roots-no-provider",
  "stream",
] }
serde = { version = "1.0", default-features = false, features = ["derive"] }
serde_json = { version = "1.0", default-features = false, features = ["std"] }
sha2 = "0.10"
tokio = { version = "1.50", default-features = false, features = ["sync", "fs", "io-util", "time", "net", "macros"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = [
  "connect",
  "rustls-tls-webpki-roots",
] }
uuid = { version = "1.22", default-features = false, features = ["std", "v4"] }

[dev-dependencies]
tempfile = "3.26"
toml = "1.0"
wiremock = "0.6"
tokio = { version = "1.50", default-features = false, features = [
  "macros",
  "rt-multi-thread",
  "sync",
  "net",
  "io-util",
  "time",
] }

[features]
default = []
