[package]
name = "galleon-tunnel"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Tunnel management subsystem for ClawCrew / Galleon Fleet."
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
publish = true

[lints]
workspace = true

[dependencies]
galleon-config.workspace = true
galleon-log.workspace = true
galleon-spawn.workspace = true
anyhow = "1.0"
async-trait = "0.1"
serde_json = { version = "1.0", default-features = false, features = ["std"] }
tokio = { version = "1.50", default-features = false, features = ["sync", "process", "io-util"] }

[dev-dependencies]
tokio = { version = "1.50", features = ["rt-multi-thread", "macros"] }
