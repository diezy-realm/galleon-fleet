[package]
name = "galleon-channel-filesystem"
rust-version.workspace = true
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Filesystem channel feature-crate (RF-B1 split; notify and glob ported from galleon-channels)."
repository.workspace = true
homepage.workspace = true
publish = true

[dependencies]
galleon-channel-core.workspace = true
galleon-api.workspace = true
galleon-infra.workspace = true
galleon-config = { workspace = true, default-features = false }
galleon-log.workspace = true
async-trait = "0.1"
anyhow = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
glob = "0.3"
notify = "6"
sha2 = "0.10"
serde = { version = "1.0", default-features = false, features = ["derive"] }
serde_json = { version = "1.0", default-features = false, features = ["std"] }
tokio = { version = "1.50", default-features = false, features = ["sync", "time"] }

[dev-dependencies]
galleon-spawn.workspace = true
tempfile = "3.26"
tokio = { version = "1.50", default-features = false, features = [
  "macros",
  "rt-multi-thread",
] }

[features]
default = []
