[package]
name = "galleon-fleet-core"
description = "Pure domain types, store, and policies for Galleon Fleet."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
publish = true

[lints]
workspace = true

[dependencies]
regex = "1.10"
serde = { version = "1.0", default-features = false, features = ["derive"] }
serde_json = { version = "1.0", default-features = false, features = ["std"] }
sha2 = "0.10"
tempfile = "3.26"
thiserror = "2.0"
tokio = { version = "1.50", default-features = false, features = ["sync"] }

[dev-dependencies]
insta = { version = "1.48", features = ["yaml"] }
tempfile = "3.26"
tokio = { version = "1.50", features = ["rt-multi-thread", "macros"] }
