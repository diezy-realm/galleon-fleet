[package]
name = "galleon-channel-nostr"
rust-version.workspace = true
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Nostr channel feature-crate (RF-B1 split; NIP-04/NIP-17 private messages ported from galleon-channels)."
repository.workspace = true
homepage.workspace = true
publish = true

[lints]
workspace = true

[dependencies]
galleon-channel-core.workspace = true
galleon-api.workspace = true
galleon-log.workspace = true
async-trait = "0.1"
anyhow = "1.0"
tokio = { version = "1.50", default-features = false, features = ["sync"] }
serde_json = { version = "1.0", default-features = false, features = ["std"] }
nostr-sdk = { version = "0.44", default-features = false, features = [
  "nip04",
  "nip59",
] }

[dev-dependencies]
tokio = { version = "1.50", default-features = false, features = [
  "macros",
  "rt",
  "sync",
] }

[features]
default = []
