# Galleon Fleet — Production Nginx Configuration (PL-C1)
# ========================================================
# Reverse Proxy to Galleon Rust Gateway (:42617)
# Supports WebSockets, HSTS, Rate Limiting, and Modern Security Headers.

# Rate limiting zone for Galleon API endpoints
limit_req_zone $binary_remote_addr zone=galleon_api_limit:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=galleon_auth_limit:10m rate=5r/s;

upstream galleon_backend {
    server 127.0.0.1:42617;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name galleon.local your-domain.example.com;

    # Redirect all HTTP requests to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name galleon.local your-domain.example.com;

    # TLS Configuration
    ssl_certificate /etc/letsencrypt/live/your-domain.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' wss://$host https://$host;" always;

    # Proxy buffers and timeouts
    proxy_read_timeout 300s;
    proxy_connect_timeout 60s;
    proxy_send_timeout 300s;
    proxy_http_version 1.1;

    # WebSocket endpoints
    location /ws {
        limit_req zone=galleon_api_limit burst=50 nodelay;
        proxy_pass http://galleon_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Pairing endpoints (strict rate limiting)
    location = /pair {
        limit_req zone=galleon_auth_limit burst=10 nodelay;
        proxy_pass http://galleon_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /pair/code {
        limit_req zone=galleon_auth_limit burst=10 nodelay;
        proxy_pass http://galleon_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Auth and pairing API endpoints (stricter rate limit)
    location ~* ^/api/(pairing|pair|auth|login) {
        limit_req zone=galleon_auth_limit burst=10 nodelay;
        proxy_pass http://galleon_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Standard API endpoints
    location / {
        limit_req zone=galleon_api_limit burst=100 nodelay;
        proxy_pass http://galleon_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
